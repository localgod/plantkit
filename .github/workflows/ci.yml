name: 🔨CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs Vite+, Node.js and npm, then runs `vp install`.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
      # examples/ and scripts/generate-smoke.mts import the built package,
      # so build before type checking.
      - name: Build
        run: |
          vp run prebuild
          vp pack
      - name: Check (format, lint, type check)
        run: vp check
      - name: Lint Markdown
        run: vp run mdlint
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: '24'
          cache: true
      - name: Install PlantUML
        run: |
          ./support.sh
      - name: Test
        run: |
          vp run prebuild
          vp pack
          vp test --run --coverage
          vp run test:plantuml
          vp run test:neutral
      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: always()
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
