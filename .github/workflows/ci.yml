name: 🔨CI
on:
  push:
    branches:
      - main
  # Every base branch, so stacked pull requests are checked too.
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
  # Called by npm-publish.yml before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to a pull request supersedes the running checks.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # `npm install` runs `prepare: vp config`; CI needs no Git hooks.
  VP_GIT_HOOKS: '0'

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs Vite+, Node.js and npm, then runs `vp install`.
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
      # examples/ and scripts/generate-smoke.mts import the built package,
      # so build before type checking.
      - name: Build
        run: |
          vp run prebuild
          vp pack
      - name: Check (format, lint, type check)
        run: vp check
      - name: Lint Markdown
        run: vp run mdlint
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: '24'
          cache: true
      - name: Install PlantUML
        run: |
          ./support.sh
      - name: Test
        run: |
          vp run prebuild
          vp pack
          vp test --run --coverage
          vp run test:plantuml
          vp run test:neutral
      - name: Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@8f86cfb56ed6d5613ea8cdc5259f207fbfd51ece # v2.13.1
        # Pull requests from forks get a read-only token and cannot be commented on.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          json-summary-path: ./coverage/coverage-summary.json
          json-final-path: ./coverage/coverage-final.json
